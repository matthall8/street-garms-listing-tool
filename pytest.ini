[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# Only test_*.py is collected, which deliberately excludes the three scoring
# reports. Those are measurements, not pass/fail, and are run by hand:
#   python3 tests/report_art_number.py     offline, prints decoder accuracy
#   python3 tests/report_split_on_truth.py offline, the split against the labels
#   python3 tests/eval_transcription.py    costs an API call per photo
