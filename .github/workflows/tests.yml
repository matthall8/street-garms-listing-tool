name: Listing Tools Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    # Real-Postgres tests: the same pinned tag as local (CLAUDE.md, Commands).
    # The password is throwaway; the service lives only for this job.
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Required: with CI set, the fixture fails rather than skips without it.
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked  # fails if uv.lock is out of date
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked pyright
        if: ${{ !cancelled() }}  # report types even when lint fails
      - run: uv run --locked python -m pytest -rs
        if: ${{ !cancelled() }}  # report tests even when lint fails

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci  # fails if package-lock.json is out of date
      - run: npm run build
      - run: npm run typecheck
        if: ${{ !cancelled() }}  # report types even when the build fails
      - run: npm run lint
        if: ${{ !cancelled() }}  # report lint even when the build fails
      - run: npm test
        if: ${{ !cancelled() }}  # report tests even when the build fails

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/amd64 -t listing-tool:ci .
      # Fails by name if a driver doesn't load in the image, whatever the app
      # happens to import at startup. Proves they load, not that they connect.
      - run: docker run --rm listing-tool:ci python -c "import psycopg, google.cloud.storage, google.cloud.sql.connector"
      # A non-default PORT, as Cloud Run injects one. No key, no catalogue.
      - run: docker run -d --name app -e PORT=9090 -p 9090:9090 listing-tool:ci
      # Starting proves no file the app needs is missing from the image.
      - run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --max-time 5 -o /dev/null http://localhost:9090/
      - run: curl --fail --silent --show-error --max-time 5 -o /dev/null http://localhost:9090/static/style.css
      - run: docker logs app
        if: ${{ failure() }}
