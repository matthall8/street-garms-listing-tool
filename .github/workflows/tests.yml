name: Listing Tools Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked  # fails if uv.lock is out of date
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked pyright
        if: ${{ !cancelled() }}  # report types even when lint fails
      - run: uv run --locked python -m pytest -rs
        if: ${{ !cancelled() }}  # report tests even when lint fails

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci  # fails if package-lock.json is out of date
      - run: npm run build
      - run: npm run typecheck
        if: ${{ !cancelled() }}  # report types even when the build fails
      - run: npm run lint
        if: ${{ !cancelled() }}  # report lint even when the build fails
      - run: npm test
        if: ${{ !cancelled() }}  # report tests even when the build fails

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/amd64 -t listing-tool:ci .
      # A non-default PORT, as Cloud Run injects one. No key, no catalogue.
      - run: docker run -d --name app -e PORT=9090 -p 9090:9090 listing-tool:ci
      # Starting proves no file the app needs is missing from the image.
      - run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors --max-time 5 -o /dev/null http://localhost:9090/
      - run: curl --fail --silent --show-error --max-time 5 -o /dev/null http://localhost:9090/static/style.css
      - run: docker logs app
        if: ${{ failure() }}
