{% extends "base.html" %}
{% block content %}

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" enctype="multipart/form-data" id="form">
  <p class="lead">One photo is enough when everything is on one label — usually
    C.P. Company. Add a second when the ART number sits on its own tag —
    usually Stone Island.</p>

  <div class="shots">
    <label class="drop" for="art_photo">
      <span class="big">Main label</span>
      <span class="hint">The care label, or whichever tag shows the most.</span>
      <!-- capture="environment" opens the rear camera over plain HTTP,
           unlike getUserMedia which needs a secure context. -->
      <input type="file" id="art_photo" name="art_photo" accept="image/*" capture="environment">
      <img class="preview" alt="">
    </label>

    <label class="drop" for="details_photo">
      <span class="big">Second tag <span class="dim">— optional</span></span>
      <span class="hint">Add this if the ART number is on a separate tag, or
        folded behind the care label.</span>
      <input type="file" id="details_photo" name="details_photo" accept="image/*" capture="environment">
      <img class="preview" alt="">
    </label>
  </div>

  <button type="submit">Read label</button>
  <p class="working" id="working">Reading label…</p>
</form>

<script>
  for (const input of document.querySelectorAll('.drop input')) {
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const img = input.parentElement.querySelector('.preview');
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
    });
  }

  // Two API calls take a few seconds — show that something is happening.
  const form = document.getElementById('form');
  form.addEventListener('submit', () => {
    document.getElementById('working').style.display = 'block';
    form.querySelector('button').disabled = true;
  });
</script>
{% endblock %}
