{% extends "base.html" %}
{% block content %}

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post" enctype="multipart/form-data" id="form">
  <p class="lead">One photo per garment. Make sure the ART number is in frame —
    on Stone Island it often sits on its own tag, separate from the care label.</p>

  <label class="drop" for="art_photo">
    <span class="big">Label photo</span>
    <span class="hint">The tag that shows the ART number.</span>
    <!-- capture="environment" opens the rear camera over plain HTTP,
         unlike getUserMedia which needs a secure context. -->
    <input type="file" id="art_photo" name="art_photo" accept="image/*" capture="environment">
    <img class="preview" alt="">
  </label>

  <button type="submit">Read label</button>
  <p class="working" id="working">Reading label…</p>
</form>

<script>
  for (const input of document.querySelectorAll('.drop input')) {
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const img = input.parentElement.querySelector('.preview');
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
    });
  }

  // The API call takes a few seconds — show that something is happening.
  const form = document.getElementById('form');
  form.addEventListener('submit', () => {
    document.getElementById('working').style.display = 'block';
    form.querySelector('button').disabled = true;
  });
</script>
{% endblock %}
