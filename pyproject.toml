[project]
name = "listing-tool"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "pandas==3.0.5",
    "pydantic-ai==2.32.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
    "pydantic-evals==2.32.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.0",
]
# Notebooks and barcode scanning. Opt-in: `uv sync --group explore`.
# Not needed by the app, tests or CI; zbar-py builds from source.
explore = [
    "notebook==7.6.2",
    "opencv-python==5.0.0.93",
    "pyzbar==0.1.9",
    "zbar-py==1.0.4",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["labels", "app", "tests", "main.py"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"   # matches CI
src = [".", "tests"]        # so imports of tests/ modules sort as first-party

[tool.ruff.lint]
# Listed explicitly: ruff's default set changes between releases.
# E4, E7, E9, F: real errors such as unused imports and undefined names.
# I: import order. B: likely bugs (bugbear). Not style. Add more rule sets
# later, one per PR.
select = ["E4", "E7", "E9", "F", "I", "B"]
